name: StorySpace scientific controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify scoring and provenance boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full reproducibility package
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run adversarial controls
        run: node --test tests/core.test.cjs
      - name: JavaScript syntax checks
        run: |
          node --check src/core.js
          node --check src/app.js
      - name: Inspect required browser document hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text()
          j = Path("src/app.js").read_text()
          needed = ("metricExperiences", "metricFrozen", "metricResolved", "metricScore", "countNote", "scoreNote",
                    "recordForm", "probability", "probabilityValue", "records", "claimForm", "claimTree",
                    "filterButton", "filterMessage", "rawBars", "aBars", "bBars", "partitionView",
                    "exportButton", "importButton", "importFile", "resetButton", "activeLabel")
          missing = [x for x in needed if ('id="' + x + '"') not in s]
          assert not missing, f"Missing elements: {missing}"
          assert "src/core.js" in s and "src/app.js" in s
          assert "NO TELEMETRY" in s and "UNRESOLVED" in s
          print("All browser hooks and research-boundary notices present.")
          PY
